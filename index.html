<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StudyArc — Minimal Focus & Habit Tracker</title>
  <meta name="description" content="StudyArc is a minimal, elegant study time tracker featuring a circular focus timer, GitHub-style consistency heatmap, XP, and streak progression.">
  
  <!-- Open Graph / Facebook / Discord / LinkedIn / WhatsApp Social Media Banners -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="StudyArc">
  <meta property="og:title" content="StudyArc — Minimal Focus & Habit Tracker">
  <meta property="og:description" content="Level up your study habits with a circular focus dial, GitHub-style consistency heatmap, XP progression, and clean minimal aesthetics.">
  <meta property="og:image" content="https://files.catbox.moe/he9ic7.png">
  <meta property="og:image:secure_url" content="https://files.catbox.moe/he9ic7.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="StudyArc — Minimal Focus & Habit Tracker">
  <meta property="og:image" content="https://files.catbox.moe/txwp6p.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">

  <!-- Twitter / X Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="StudyArc — Minimal Focus & Habit Tracker">
  <meta name="twitter:description" content="Level up your study habits with a circular focus dial, GitHub-style consistency heatmap, XP progression, and clean minimal aesthetics.">
  <meta name="twitter:image" content="https://files.catbox.moe/he9ic7.png">
  <meta name="twitter:image:alt" content="StudyArc — Minimal Focus & Habit Tracker">
  
  <!-- PWA & Mobile Configuration -->
  <meta name="theme-color" content="#070D09">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StudyArc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="StudyArc">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Favicons and Apple Touch Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/assets/icon-120.png">
  
  <!-- Typography: Plus Jakarta Sans for UI, Lilita One & Titan One for bold rounded thick numerals -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=DynaPuff:wght@700&family=Lilita+One&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Titan+One&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css?v=5.3">
  <script>
    (function () {
      try {
        var s = localStorage.getItem('studyarc_store_v1');
        if (!s || !JSON.parse(s).authenticated) {
          document.documentElement.classList.add('unauthenticated-gate');
        }
      } catch (e) {
        document.documentElement.classList.add('unauthenticated-gate');
      }
    })();
  </script>
</head>
<body>
  <!-- AMBIENT FLUID GREEN AURA & CONSTELLATION WEB BACKGROUND -->
  <div class="ambient-aura-container" id="ambient-aura-container" aria-hidden="true">
    <div class="aura-blob aura-blob-primary"></div>
    <div class="aura-blob aura-blob-secondary"></div>
    <div class="aura-blob aura-blob-center"></div>
    <canvas id="ambient-constellation-canvas" class="ambient-constellation-canvas"></canvas>
  </div>

  <div class="app-layout">
    


    <!-- MAIN VIEWPORT -->
    <main class="main-viewport">
      
      <!-- TOP HEADER (Desktop Avatar / Mobile Branding & Top Bar) -->
      <header class="app-header">
        <div class="mobile-brand" id="brand-home" title="StudyArc • Focus">
          <svg class="brand-leaf" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11.5 20.5A7.5 7.5 0 0 1 10.2 5.6C16.3 4.4 17.9 3.8 20 1.2c1.1 2.1 2.1 4.5 2.1 8.6 0 5.9-5.1 10.7-10.6 10.7Z" fill="currentColor"/>
            <path d="M1.8 21.6c0-3.2 2-5.7 5.4-6.4 2.6-.5 5.3-2.1 6.3-3.2" stroke="#080B0A" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span class="brand-text">StudyArc</span>
        </div>

        <div class="header-right">
          <!-- Topic Pill: Right-aligned next to profile avatar, visible ONLY when a timer session is active/set -->
          <div class="header-topic-pill hidden" id="header-topic-pill" title="">
            <span class="header-topic-dot" aria-hidden="true"></span>
            <span class="header-topic-name" id="header-topic-name"></span>
          </div>

          <!-- Sign In button (Visible when unauthenticated) -->
          <button class="btn-header-auth hidden" id="btn-header-auth" title="Sign In or Create Account">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            <span>Sign In</span>
          </button>

          <!-- Minimal Profile Avatar Button (Toggles Settings & displays user initial when signed in) -->
          <button class="profile-avatar-btn" id="btn-profile" title="Settings &amp; Preferences" aria-label="Settings">
            <span class="user-avatar-dot hidden" id="header-user-initial">A</span>
            <svg class="profile-avatar-default-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="10" r="3"></circle>
              <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- VIEW 1: FOCUS DASHBOARD (Default / Main Screen) -->
      <section class="view-panel active" id="view-focus">
        
        <!-- MAIN FOCUS TIMER (The Hero Element) -->
        <div class="timer-section">
          <div class="timer-wrapper">
            <svg class="timer-svg" id="timer-svg" viewBox="0 0 420 420">
              <defs>
                <!-- Liquid Emerald Gradient -->
                <linearGradient id="liquid-flow-green" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#6EFEB0" />
                  <stop offset="35%" stop-color="#14F572" />
                  <stop offset="70%" stop-color="#05DB65" />
                  <stop offset="100%" stop-color="#02A346" />
                </linearGradient>

                <!-- Liquid Amber Gradient -->
                <linearGradient id="liquid-flow-amber" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#FFE4A0" />
                  <stop offset="35%" stop-color="#F5B258" />
                  <stop offset="70%" stop-color="#E59432" />
                  <stop offset="100%" stop-color="#C26A14" />
                </linearGradient>

                <!-- Liquid Bead Jewel Green Gradient -->
                <radialGradient id="liquid-bead-green" cx="35%" cy="35%" r="65%">
                  <stop offset="0%" stop-color="#C9FFE3" />
                  <stop offset="40%" stop-color="#4EFA8F" />
                  <stop offset="85%" stop-color="#10E068" />
                  <stop offset="100%" stop-color="#059942" />
                </radialGradient>

                <!-- Liquid Bead Jewel Amber Gradient -->
                <radialGradient id="liquid-bead-amber" cx="35%" cy="35%" r="65%">
                  <stop offset="0%" stop-color="#FFF2D6" />
                  <stop offset="40%" stop-color="#FCE1A8" />
                  <stop offset="85%" stop-color="#E5A958" />
                  <stop offset="100%" stop-color="#B86C18" />
                </radialGradient>
              </defs>

              <!-- Dark circular liquid conduit track -->
              <circle class="timer-track" id="timer-track" cx="210" cy="210" r="172"></circle>
              <!-- Luminous liquid progress arc (Circumference = 2 * PI * 172 ≈ 1080.7) -->
              <circle class="timer-arc" id="timer-arc" cx="210" cy="210" r="172" stroke-dasharray="1080.7" stroke-dashoffset="540.35" transform="rotate(-90 210 210)"></circle>
              <!-- Interactive Draggable Liquid Droplet Bead -->
              <g class="timer-bead-group" id="timer-bead-group" transform="translate(210, 382)">
                <!-- Touch target hit area for effortless mobile dragging -->
                <circle class="bead-touch-target" cx="0" cy="0" r="32"></circle>
                <!-- Glowing liquid halo aura -->
                <circle class="timer-bead-glow" cx="0" cy="0" r="20"></circle>
                <!-- Liquid surface tension rim -->
                <circle class="timer-bead-rim" cx="0" cy="0" r="13.5"></circle>
                <!-- Central thick liquid bead droplet -->
                <circle class="timer-bead" id="timer-bead" cx="0" cy="0" r="11"></circle>
                <!-- Specular liquid highlight reflection glint -->
                <circle class="timer-bead-highlight" cx="-3.5" cy="-3.5" r="3"></circle>
              </g>
            </svg>

            <!-- Center Content inside Timer Circle (Tap anywhere to start/pause, Hold 2s to reset) -->
            <div class="timer-center-content" id="timer-center-pad" role="button" tabindex="0" aria-label="Timer ready. Tap to start, drag bead to adjust.">
              <div class="timer-digits has-hours" id="timer-digits">
                <span class="timer-hours-wrap" id="timer-hours-wrap">
                  <span class="timer-hours-inner">
                    <span class="timer-num" id="timer-hours-val">1</span><span class="timer-colon">:</span>
                  </span>
                </span>
                <span class="timer-min-sec" id="timer-min-sec">
                  <span class="timer-num" id="timer-mins-val">30</span><span class="timer-colon">:</span><span class="timer-num" id="timer-secs-val">00</span>
                </span>
              </div>
              <div class="timer-state-dot" id="timer-state-dot" aria-hidden="true"></div>
            </div>

            <!-- Floating Video-Game Style Pill Particle Layer -->
            <div class="timer-flying-pills-layer" id="timer-flying-pills-layer" aria-hidden="true"></div>
          </div>
        </div>

        <!-- COMPACT GAMIFICATION STATISTICS STRIP -->
        <div class="stats-strip" aria-label="Study Progress Statistics">
          <!-- Day Streak -->
          <div class="stat-item">
            <div class="stat-icon-box">
              <svg class="flame-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
              </svg>
            </div>
            <div class="stat-data">
              <span class="stat-number" id="stat-streak">0</span>
              <span class="stat-title">Day Streak</span>
            </div>
          </div>

          <!-- Total XP -->
          <div class="stat-item stat-item-xp">
            <div class="stat-icon-box">
              <svg class="star-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8L12 2z"></path>
              </svg>
            </div>
            <div class="stat-data">
              <span class="stat-number stat-xp-number" id="stat-xp">0</span>
              <span class="stat-title">Total XP</span>
            </div>
          </div>

          <!-- Today's Focus (Live Ticking) -->
          <div class="stat-item stat-item-clickable" id="stat-item-today" title="Today's Focus • Click to view Day Record" role="button" tabindex="0">
            <div class="stat-icon-box">
              <svg class="clock-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            </div>
            <div class="stat-data">
              <span class="stat-number stat-today-live" id="stat-today-focus">0m 00s</span>
              <span class="stat-title">Today's Focus</span>
            </div>
          </div>
        </div>

        <!-- COMPACT MONTHLY ACTIVITY HEATMAP CARD -->
        <div class="heatmap-card" aria-label="Activity Consistency Heatmap">
          <!-- Heatmap Viewport (Weekdays column + multi-month grid) -->
          <div class="heatmap-body-wrap">
            <div class="heatmap-weekdays" aria-hidden="true">
              <span class="weekday-label">M</span>
              <span class="weekday-label">T</span>
              <span class="weekday-label">W</span>
              <span class="weekday-label">T</span>
              <span class="weekday-label">F</span>
              <span class="weekday-label">S</span>
              <span class="weekday-label">S</span>
            </div>

            <div class="heatmap-scroll-area" id="heatmap-scroll-area">
              <div class="heatmap-track" id="heatmap-track">
                <!-- Dynamically populated accurate monthly calendar blocks with sticky year by app.js -->
              </div>
            </div>
          </div>
        </div>

      </section>

      <!-- VIEW 4: SETTINGS & PREFERENCES -->
      <section class="view-panel hidden" id="view-settings">
        <div class="panel-inner settings-panel-inner">
          <div class="settings-header-row">
            <h2 class="settings-heading">Settings</h2>
            <button class="settings-close-btn" id="btn-close-settings" title="Back to Timer" aria-label="Back to Timer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <!-- Minimal User Profile Card -->
          <div class="settings-profile-card" id="user-profile-card">
            <div class="settings-profile-left">
              <div class="settings-user-avatar" id="setting-user-avatar">U</div>
              <div class="settings-user-meta">
                <span class="settings-username" id="setting-username-display">Signed In User</span>
                <span class="settings-status-pill">
                  <span class="settings-status-dot" aria-hidden="true"></span>
                  <span>Cloud Sync</span>
                </span>
              </div>
            </div>
            <button class="settings-logout-btn" id="btn-logout" title="Sign Out of StudyArc">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>Sign Out</span>
            </button>
          </div>

          <!-- Compact Preferences Group -->
          <div class="settings-group">
            <!-- Row 1: Total Focus -->
            <div class="settings-row">
              <div class="settings-row-left">
                <div class="settings-row-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                  </svg>
                </div>
                <span class="settings-row-label">Total Focus</span>
              </div>
              <span class="settings-value-pill" id="setting-total-focus">0h 0m</span>
            </div>

            <!-- Row 2: Sound Effects -->
            <div class="settings-row">
              <div class="settings-row-left">
                <div class="settings-row-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                  </svg>
                </div>
                <span class="settings-row-label">Sound Effects</span>
              </div>
              <label class="switch">
                <input type="checkbox" id="setting-sound-enabled" checked>
                <span class="switch-slider"></span>
              </label>
            </div>

            <!-- Row 3: Danger Wipe Progress -->
            <div class="settings-row settings-row-danger">
              <div class="settings-row-left">
                <div class="settings-row-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"></path>
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                  </svg>
                </div>
                <span class="settings-row-label">Reset Progress</span>
              </div>
              <button class="settings-danger-btn" id="btn-wipe-data">Reset</button>
            </div>
          </div>
        </div>
      </section>

      <!-- DAY DETAIL MODAL DIALOG (Opened via Today pill or clicking any Heatmap cell) -->
      <dialog id="day-detail-dialog" class="day-detail-dialog" closedby="any" aria-labelledby="day-dialog-title">
        <div class="day-dialog-shell">
          <!-- Header -->
          <div class="day-dialog-header">
            <div class="day-dialog-header-info">
              <span class="day-dialog-badge" id="day-dialog-badge">Day Record</span>
              <h2 class="day-dialog-title" id="day-dialog-title">Day Record</h2>
            </div>
            <button class="day-dialog-close-btn" id="btn-close-day-dialog" aria-label="Close Day Record">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <!-- 3 Minimal Highlight Metric Cards -->
          <div class="day-summary-strip" aria-label="Day Summary Metrics">
            <!-- Total Time -->
            <div class="day-pill">
              <span class="day-pill-label">Total Time</span>
              <span class="day-pill-value" id="day-pill-time">0m</span>
            </div>

            <!-- Total Sessions -->
            <div class="day-pill">
              <span class="day-pill-label">Sessions</span>
              <span class="day-pill-value" id="day-pill-sessions">0</span>
            </div>

            <!-- Total XP Gained -->
            <div class="day-pill day-pill-xp">
              <span class="day-pill-label">XP Gained</span>
              <span class="day-pill-value" id="day-pill-xp">+0 XP</span>
            </div>
          </div>

          <!-- Sessions Timeline Feed for that Day -->
          <div class="day-timeline-wrapper">
            <div class="day-timeline-heading">
              <span>Timeline & Sessions</span>
              <span class="day-timeline-count" id="day-timeline-count">0 sessions</span>
            </div>
            <div class="day-sessions-list" id="day-sessions-list">
              <!-- Dynamically populated -->
            </div>
          </div>
        </div>
      </dialog>

      <!-- TASK PROMPT MODAL (Minimal, Ultra-Compact Floating Card) -->
      <div id="task-prompt-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Start Focus Session">
        <div class="modal-backdrop" id="task-prompt-backdrop"></div>
        <div class="task-prompt-dialog">
          <form class="task-prompt-shell" id="task-prompt-form">
            <!-- Compact Header Row -->
            <div class="task-prompt-header">
              <div class="task-prompt-header-left">
                <span class="task-prompt-pulse-dot" aria-hidden="true"></span>
                <span class="task-prompt-duration-pill" id="task-prompt-duration">60m Focus</span>
              </div>
              <button type="button" class="task-prompt-close-btn" id="btn-cancel-task" title="Close" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>

            <!-- Integrated Input Field with Start Button -->
            <div class="task-input-wrapper">
              <input 
                type="text" 
                id="input-task-name" 
                class="task-name-input" 
                placeholder="What are you focusing on?" 
                maxlength="45"
                autocomplete="off"
              >
              <button type="submit" class="btn-task-start" id="btn-start-task" title="Start Focus" aria-label="Start Focus">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <span>Start</span>
              </button>
            </div>

            <!-- 4 Recent Quick Chips (No wordy label) -->
            <div class="task-suggestions-chips" id="task-suggestions-chips">
              <!-- Dynamically populated with 4 most recent subjects -->
            </div>
          </form>
        </div>
      </div>

      <!-- AUTHENTICATION MODAL DIALOG (Neon Green 3D Flippable Modal) -->
      <dialog id="auth-dialog" class="auth-dialog" aria-labelledby="auth-modal-title">
        <!-- Floating Ambient Dots Background Canvas -->
        <canvas id="auth-dots-canvas" class="auth-dots-canvas" aria-hidden="true"></canvas>

        <!-- Top Green Ambient Light Glow (Neon Green Modal Style) -->
        <div class="auth-top-ambient-glow" aria-hidden="true"></div>

        <div class="auth-card-scene" id="auth-card-scene">
          <div class="auth-card-flipper" id="auth-card-flipper">
            
            <!-- FRONT FACE: SIGN IN -->
            <div class="auth-card-face auth-card-front" id="auth-card-front">
              <div class="auth-card-glass-glow" aria-hidden="true"></div>

              <div class="auth-header-row">
                <h2 class="auth-title" id="auth-modal-title">Sign In</h2>
                <div class="auth-switch-group">
                  <div class="auth-header-divider"></div>
                  <button type="button" class="auth-switch-btn" id="btn-flip-to-signup">
                    <span>Create account</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                      <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                  </button>
                </div>
              </div>

              <form class="auth-form-body" id="form-auth-login" autocomplete="on">
                <div class="auth-error-banner hidden" id="login-error-msg"></div>

                <div class="auth-input-container">
                  <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  <input 
                    type="text" 
                    id="login-username" 
                    class="auth-input-el" 
                    placeholder="Username" 
                    autocomplete="username" 
                    required
                  >

  <!-- SERVICE WORKER REGISTRATION (PWA Offline & Mobile Support) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(registration) {
            console.log('[StudyArc PWA] Service worker registered with scope:', registration.scope);
            registration.update();
            if (registration.waiting) {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
          })
          .catch(function(error) {
            console.warn('[StudyArc PWA] Service worker registration failed:', error);
          });
      });
    }
  </script>
